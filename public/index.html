<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary meta for the shell. These absolute URLs are the canonical
       production domain and stay as written: the edge middleware only rewrites
       <head> on its matcher routes (/album, /nghe-si, /video-clip, /hub/detail,
       /tim-kiem, /newfeed), which does not include "/". -->
  <title>D4T MP3 | Nghe nhạc chất lượng cao trên desktop, mobile và TV</title>
  <meta name="description"
    content="Nghe nhạc trực tuyến miễn phí: Zing Chart, Top 100, MV, radio và playlist theo chủ đề. Web app nghe nhạc viết bằng React 18 bởi Tiến Đạt." />
  <meta name="author" content="Tiến Đạt (DatHip)" />
  <meta name="theme-color" content="#170f23" />
  <link rel="canonical" href="https://zing-mp3-d4t.vercel.app/" />

  <!-- Open Graph / Facebook / Zalo -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="D4T MP3" />
  <meta property="og:locale" content="vi_VN" />
  <meta property="og:url" content="https://zing-mp3-d4t.vercel.app/" />
  <meta property="og:title" content="D4T MP3 | Nghe nhạc chất lượng cao trên desktop, mobile và TV" />
  <meta property="og:description"
    content="Nghe nhạc trực tuyến miễn phí: Zing Chart, Top 100, MV, radio và playlist theo chủ đề." />
  <meta property="og:image" content="https://zing-mp3-d4t.vercel.app/1-2.PNG" />
  <meta property="og:image:width" content="1920" />
  <meta property="og:image:height" content="939" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="D4T MP3 | Nghe nhạc chất lượng cao trên desktop, mobile và TV" />
  <meta name="twitter:description"
    content="Nghe nhạc trực tuyến miễn phí: Zing Chart, Top 100, MV, radio và playlist theo chủ đề." />
  <meta name="twitter:image" content="https://zing-mp3-d4t.vercel.app/1-2.PNG" />

  <link rel="shortcut icon" type="image/webp" href="/pabicon.webp" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Preconnect: hot origins we hit early. Dedup: was declared 3x. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://photo-resize-zmp3.zmdcdn.me" crossorigin />
  <link rel="preconnect" href="https://zmp3-static.zmdcdn.me" crossorigin />
  <!-- DNS-prefetch: origins hit later (audio streaming CDNs) -->
  <link rel="dns-prefetch" href="https://a128-z3.zmdcdn.me" />
  <link rel="dns-prefetch" href="https://avatar.talk.zdn.vn" />

  <!-- Text fonts. Render-blocking on purpose: Inter is the LCP font.
       One request instead of three; Alfa Slab One dropped (zero usages).
       Weight 100 dropped (unused); 200-900 are all referenced in the styles. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Patrick+Hand+SC&display=swap" />

  <!-- Icon fonts, loaded non-blocking. display=block (not swap) so the raw
       ligature text ("play_arrow") never flashes before the glyphs arrive.
       Sharp and Two Tone dropped (zero usages); the fonts.sandbox.google.com
       Symbols copy dropped (internal Google host, not a production endpoint). -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&family=Material+Icons+Round&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&display=block" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&family=Material+Icons+Round&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&display=block" />
  </noscript>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "D4T MP3",
      "url": "https://zing-mp3-d4t.vercel.app/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "inLanguage": "vi-VN",
      "description": "Web app nghe nhạc trực tuyến: Zing Chart, Top 100, MV, radio và playlist theo chủ đề.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "VND" },
      "author": { "@type": "Person", "name": "Tiến Đạt", "url": "https://github.com/DatHip" }
    }
  </script>
